openapi: 3.0.3
info:
  title: WOMADS API
  version: 0.1.0
  description: |
    Web-Based Workforce Management and Deployment System for MJL Manpower Agency.

    **Authenticating in "Try it out":** log in through Supabase Auth to get an
    access token, click **Authorize**, and paste the token (without the word `Bearer`).
    Roles come from the `users` table, never from the token.

    Only implemented endpoints are listed here. Planned modules (applicants,
    employees, deployments, payroll, reports) already exist as role-guarded
    routes that answer `501 not_implemented`.
servers:
  - url: /api/v1
tags:
  - name: Careers (public)
  - name: Account
  - name: Account Management
  - name: Client Management
  - name: Job Openings
security:
  - bearerAuth: []
paths:
  /public/jobs:
    get:
      tags: [Careers (public)]
      summary: List active job openings
      security: []
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 'Search title, description or location'}
        - {name: category, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200':
          description: Active openings, newest first. Client identity is never included.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PublicJob'}}
                  meta: {$ref: '#/components/schemas/Meta'}
  /public/jobs/{id}:
    get:
      tags: [Careers (public)]
      summary: Get one active job opening
      security: []
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200':
          description: The opening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/PublicJob'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me:
    get:
      tags: [Account]
      summary: Who am I? (any signed-in user)
      responses:
        '200':
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      email: {type: string}
                      user_name: {type: string}
                      role: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users:
    get:
      tags: [Account Management]
      summary: List accounts (administrator)
      parameters:
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: q, in: query, schema: {type: string}, description: Search name or email}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/User'}}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Account Management]
      summary: Create an account (administrator)
      description: Creates the login in Supabase Auth, then stores the profile and role.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '409': {description: Email already registered}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {description: SUPABASE_SERVICE_ROLE_KEY not configured on the server}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [Account Management]
      summary: Get an account (administrator)
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Account Management]
      summary: Change name, role or active flag (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPatch'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Administrators cannot demote or deactivate themselves}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Account Management]
      summary: Archive an account (administrator)
      responses:
        '204': {description: Archived}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Administrators cannot delete themselves}
  /clients:
    get:
      tags: [Client Management]
      summary: List client companies (administrator, HR)
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Search company name}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Client'}}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Client Management]
      summary: Add a client company
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Client'}
        '422': {$ref: '#/components/responses/Invalid'}
  /clients/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [Client Management]
      summary: Get a client
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Client'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Client Management]
      summary: Edit a client (send only the fields to change)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Client'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Client Management]
      summary: Archive a client
      responses:
        '204': {description: Archived}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Client still has deployed employees}
  /clients/{id}/deployments:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [Client Management]
      summary: Employees currently deployed to this client
      responses:
        '200':
          description: Active deployments, with the contract quota in meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deployment_id: {type: string, format: uuid}
                        employee_id: {type: string, format: uuid}
                        employee_name: {type: string}
                        position: {type: string}
                        start_date: {type: string, format: date}
                        status: {type: string}
                  meta:
                    type: object
                    properties:
                      quota: {type: integer}
                      deployed: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}
  /jobs:
    get:
      tags: [Job Openings]
      summary: List all job openings, any status (administrator, HR)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, active, closed]}}
        - {name: client_id, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200':
          description: Openings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Job'}}
                  meta: {$ref: '#/components/schemas/Meta'}
    post:
      tags: [Job Openings]
      summary: Create a job opening (starts as a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobCreate'}
      responses:
        '201':
          description: Created as draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Job'}
        '422': {$ref: '#/components/responses/Invalid'}
  /jobs/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [Job Openings]
      summary: Get a job opening
      responses:
        '200':
          description: The opening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Job Openings]
      summary: Edit a draft or active opening
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobPatch'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Job'}
        '409': {description: Opening is closed}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Job Openings]
      summary: Archive a draft or closed opening
      responses:
        '204': {description: Archived}
        '409': {description: Opening is still active; close it first}
  /jobs/{id}/publish:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [Job Openings]
      summary: Publish a draft so applicants can see it
      description: Requires title, description, location and category to be filled in.
      responses:
        '200':
          description: Active (also returned if it already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Job'}
        '409': {description: Opening is closed}
        '422': {$ref: '#/components/responses/Invalid'}
  /jobs/{id}/close:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [Job Openings]
      summary: Close an active opening
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Job'}
        '409': {description: Opening is not active}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Signed in, but your role may not do this (or the account is disabled)
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: Validation failed; `error.fields` says which fields
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Role: {type: string, enum: [administrator, hr, payroll_officer, applicant, employee]}
    Meta:
      type: object
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string, example: validation_error}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/Role'}
        user_name: {type: string}
        email: {type: string}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserCreate:
      type: object
      required: [email, password, user_name, role]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 10, maxLength: 128, format: password}
        user_name: {type: string, maxLength: 100}
        role: {$ref: '#/components/schemas/Role'}
    UserPatch:
      type: object
      properties:
        user_name: {type: string, maxLength: 100}
        role: {$ref: '#/components/schemas/Role'}
        is_active: {type: boolean}
    Client:
      type: object
      properties:
        id: {type: string, format: uuid}
        company_name: {type: string}
        contact_person: {type: string}
        number_of_workers: {type: integer, minimum: 1}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClientInput:
      type: object
      description: All fields are required on create; send any subset on edit.
      properties:
        company_name: {type: string, maxLength: 200}
        contact_person: {type: string, maxLength: 200}
        number_of_workers: {type: integer, minimum: 1}
        start_date: {type: string, format: date, example: '2026-11-01'}
        end_date: {type: string, format: date, example: '2027-10-31'}
    Job:
      type: object
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        posted_by: {type: string, format: uuid}
        job_title: {type: string}
        job_description: {type: string}
        location: {type: string}
        category: {type: string}
        status: {type: string, enum: [draft, active, closed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    JobCreate:
      type: object
      required: [client_id, job_title]
      properties:
        client_id: {type: string, format: uuid}
        job_title: {type: string, maxLength: 200}
        job_description: {type: string, maxLength: 5000}
        location: {type: string, maxLength: 200}
        category: {type: string, maxLength: 100}
    JobPatch:
      type: object
      properties:
        job_title: {type: string, maxLength: 200}
        job_description: {type: string, maxLength: 5000}
        location: {type: string, maxLength: 200}
        category: {type: string, maxLength: 100}
    PublicJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        job_title: {type: string}
        job_description: {type: string}
        location: {type: string}
        category: {type: string}
        posted_at: {type: string, format: date-time}
