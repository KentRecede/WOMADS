# Starts the gateway and the core API. Supabase (database + auth) stays in the cloud.
#   docker compose up --build              gateway + api
#   docker compose --profile ai up --build  ...plus the AI screening placeholder
#
# Only the gateway is published to your machine (http://localhost:8000).
# The API and AI service are reachable only on the internal Docker network,
# which is how production should look too.

services:
  api:
    build: { context: ., args: { SERVICE: api } }
    env_file: .env
    environment:
      API_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gateway:
    build: { context: ., args: { SERVICE: gateway } }
    env_file: .env
    environment:
      GATEWAY_PORT: "8000"
      CORE_API_URL: http://api:8080      # overrides the localhost value in .env
    ports:
      - "8000:8000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  ai-screening:
    profiles: ["ai"]
    build: ./services/ai-screening
    expose: ["8090"]
    restart: unless-stopped
